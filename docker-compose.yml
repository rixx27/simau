services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simau_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_NAME: "SIMAU"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: simau_db
      DB_USERNAME: simau_user
      DB_PASSWORD: simau_secure_password
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy
    networks:
      - simau_network

  db:
    image: mysql:8.0
    container_name: simau_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: simau_db
      MYSQL_USER: simau_user
      MYSQL_PASSWORD: simau_secure_password
      MYSQL_ROOT_PASSWORD: simau_root_secure_password
    volumes:
      - simau_db_data:/var/lib/mysql
    networks:
      - simau_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "simau_user", "-psimau_secure_password"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  simau_network:
    driver: bridge

volumes:
  simau_db_data:
    driver: local
